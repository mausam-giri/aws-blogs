{{- $class := index . "class" | default "" -}}
<div class="theme-toggle{{ if $class }} {{ $class }}{{ end }}" role="group" aria-label="Color theme">
  <button type="button" class="theme-toggle__btn" data-theme-set="light" aria-label="Light theme" title="Light theme" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
  <button type="button" class="theme-toggle__btn" data-theme-set="dark" aria-label="Dark theme" title="Dark theme" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/>
    </svg>
  </button>
  <button type="button" class="theme-toggle__btn" data-theme-set="auto" aria-label="System theme" title="System theme" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M12 4v16"/>
    </svg>
  </button>
</div>
