<pagefind-config
  bundle-path="{{ "pagefind/" | relURL }}"
  base-url="{{ (urls.Parse site.BaseURL).Path }}"
  excerpt-length="24"
></pagefind-config>
<pagefind-modal-trigger class="pagefind-modal-trigger--hidden" shortcut="mod+k" hide-shortcut aria-hidden="true"></pagefind-modal-trigger>
<pagefind-modal reset-on-close></pagefind-modal>
{{- with resources.Get "pagefind-init.js" | resources.Minify -}}
<script>{{ .Content | safeJS }}</script>
{{- end -}}
{{- with resources.Get "theme-toggle.js" | resources.Minify -}}
<script>{{ .Content | safeJS }}</script>
{{- end -}}
